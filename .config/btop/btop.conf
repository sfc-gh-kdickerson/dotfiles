#? Config file for btop++
#* Only keys that differ from btop's defaults. btop fills in the rest at
#* runtime. save_config_on_exit is off so quitting btop does not rewrite this
#* file and dirty the git tree.

#* Catppuccin Mocha — https://github.com/catppuccin/btop
color_theme = "catppuccin_mocha"

#* Terminal background (Ghostty opacity / nvim transparency) shows through.
theme_background = false

truecolor = true
rounded_corners = true
graph_symbol = "braille"

#* h/j/k/l in lists. Shift-h is help, shift-k is kill.
vim_keys = true

shown_boxes = "cpu mem net proc"
update_ms = 1000
clock_format = "%H:%M"

proc_sorting = "cpu lazy"
proc_colors = true
proc_gradient = true
proc_filter_kernel = true
mem_graphs = true

#* Cloud workspaces have no /etc/fstab and ~90 overlay mounts. Root-only keeps
#* the disk box honest here and on the Mac.
use_fstab = false
only_physical = false
disks_filter = "/"

save_config_on_exit = false
