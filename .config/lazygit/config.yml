git:
  pagers:
    - colorArg: always
      pager: delta --features=catppuccin-mocha --paging=never
gui:
  showFileTree: true
  showNumstatInFilesView: true
  nerdFontsVersion: "2"
  showDivergenceFromBaseBranch: arrowAndNumber
  showIcons: true
  border: "rounded"
  sidePanelWidth: 0.25 # Reduces sidebar width to 20% of the screen
  expandFocusedSidePanel: true # Dynamically expands the active panel while shrinking others
  expandedSidePanelWeight: 8
  showCommandLog: false
  showListFooter: false
  theme:
    activeBorderColor:
      - "#89b4fa"
      - bold
    inactiveBorderColor:
      - "#a6adc8"
    searchingActiveBorderColor:
      - "#f9e2af"
    optionsTextColor:
      - "#89b4fa"
    selectedLineBgColor:
      - "#313244"
    inactiveViewSelectedLineBgColor:
      - "#6c7086"
    cherryPickedCommitFgColor:
      - "#89b4fa"
    cherryPickedCommitBgColor:
      - "#45475a"
    markedBaseCommitFgColor:
      - "#89b4fa"
    markedBaseCommitBgColor:
      - "#f9e2af"
    unstagedChangesColor:
      - "#f38ba8"
    defaultFgColor:
      - "#cdd6f4"
  authorColors:
    "*": "#b4befe"
