font_family = "Cascadia Code"
ignore_text_sizing_protocol = false

# Solarized Light. NOTE: mdfried's Theme has no field for plain body/paragraph
# text - only these decorative elements. Body text always uses the terminal's
# default foreground, which may not read well against the light tmux pane
# background `md -i mdfried` paints (see .zshrc.d/mdv.sh).
[theme]
blockquote_colors = ["#6c71c4", "#d33682", "#268bd2", "#2aa198", "#859900", "#cb4b16"]
link_bg = "#eee8d5"
link_fg = "#268bd2"
prefix_color = "#073642"
emphasis_color = "#cb4b16"
code_bg = "#eee8d5"
code_fg = "#dc322f"
hr_color = "#93a1a1"
table_border_color = "#93a1a1"
table_header_color = "#073642"
header_color = "#073642"
