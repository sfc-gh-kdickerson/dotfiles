# ============================================================================
# 1. Server / terminal
# ============================================================================
set-option -sa terminal-overrides ",xterm*:Tc"
set -g default-terminal "xterm-256color"
set -g mouse on
set -gq allow-passthrough on
set -g visual-activity off
set -g extended-keys on
set -g repeat-time 800          # window for repeatable (-r) resize binds below

# ============================================================================
# 2. Indexing & window naming
# ============================================================================
set -g base-index 1
set -g pane-base-index 1
set-option -g renumber-windows on
set -wg automatic-rename on
set -g automatic-rename-format "Window"

# ============================================================================
# 3. Key bindings
# ============================================================================
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# vim-style pane selection
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# resize panes (repeatable; see repeat-time above)
bind -r c-Up    resize-pane -U 5
bind -r c-Down  resize-pane -D 5
bind -r c-Left  resize-pane -L 5
bind -r c-Right resize-pane -R 5

# kill without confirmation
bind-key x kill-pane
bind-key X kill-window

# copy-mode (vi)
setw -g mode-keys vi
bind-key -T copy-mode-vi v   send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y   send-keys -X copy-selection-and-cancel

# splits keep the current path
bind '"' split-window   -c "#{pane_current_path}"
bind %   split-window -h -c "#{pane_current_path}"

# ============================================================================
# 4. Palette & glyphs  (Catppuccin Mocha — single source of truth)
#    Matched to ~/.config/sketchybar/variables.sh. Defined directly (not via
#    the catppuccin plugin) so the palette is self-contained; formats expand
#    these lazily at draw time, so load order vs. plugins does not matter.
# ============================================================================
set -g @thm_base      "#1e1e2e"
set -g @thm_mantle    "#181825"
set -g @thm_surface_0 "#313244"
set -g @thm_surface_1 "#45475a"
set -g @thm_text      "#cdd6f4"
set -g @thm_subtext_1 "#bac2de"
set -g @thm_overlay_0 "#6c7086"
set -g @thm_green     "#a6e3a1"
set -g @thm_maroon    "#eba0ac"
set -g @thm_blue      "#89b4fa"
set -g @thm_peach     "#fab387"
set -g @thm_pink      "#f5c2e7"
set -g @thm_red       "#f38ba8"

# Glyphs (icons) + pill caps. Pills are bg-filled spaces; widen by adding spaces.
set -g @ic_session ""   # U+EBC8  (copy from old status-left)
set -g @ic_cmd     ""   # U+EA85  (copy from old status-left)
set -g @ic_git     "󰘬"   # U+F062C (copy from old status-right)
set -g @ic_zoom    ""   # U+F00E  (copy from old status-right)
set -g @pill_l     " "   # left cap: background-filled pad (add spaces to widen)
set -g @pill_r     " "   # right cap: background-filled pad (add spaces to widen)

# ============================================================================
# 5. Status bar
# ============================================================================
set -g status-position top
set -g @thm_bg default
set -g status-style "bg=#{@thm_bg}"
set -g status-justify "absolute-centre"

# status-left: session pill (green icon, neutral label; fills peach while prefix held)
set -g status-left-length 120
set -g status-left " "
set -ga status-left "#{?client_prefix,#[bg=#{@thm_peach}]#{@pill_l}#[fg=#{@thm_base}#,bg=#{@thm_peach}#,bold] #{@ic_session} #S #[bg=#{@thm_peach}]#{@pill_r}#[bg=default],#[bg=#{@thm_base}]#{@pill_l}#[fg=#{@thm_green}#,bg=#{@thm_base}] #{@ic_session} #[fg=#{@thm_subtext_1}#,bg=#{@thm_base}]#S #[bg=#{@thm_base}]#{@pill_r}#[bg=default]}"

# status-right: git pill (in-worktree only) + zoom pill (when zoomed)
set -g status-right-length 120
set -g status-right ""
set -ga status-right "#(cd #{pane_current_path} 2>/dev/null && git rev-parse --is-inside-work-tree >/dev/null 2>&1 && echo \"#[bg=#{@thm_base}]#{@pill_l}#[fg=#{@thm_blue},bg=#{@thm_base}] #{@ic_git} #[fg=#{@thm_subtext_1},bg=#{@thm_base}]$(git rev-parse --abbrev-ref HEAD) #[bg=#{@thm_base}]#{@pill_r}#[bg=default]\")"
set -ga status-right " "
set -ga status-right "#{?window_zoomed_flag,#[bg=#{@thm_pink}]#{@pill_l}#[fg=#{@thm_base}#,bg=#{@thm_pink}#,bold] #{@ic_zoom} zoom #[bg=#{@thm_pink}]#{@pill_r}#[bg=default],}"

# window list (centered): idle = flat overlay text, active = base chip pill w/ peach index
set -g window-status-format " #[fg=#{@thm_overlay_0}]#I#{?#{!=:#{window_name},Window},: #W,} "
set -g window-status-style "bg=default"
set -g window-status-last-style "bg=default,fg=#{@thm_overlay_0}"
set -g window-status-activity-style "bg=default,fg=#{@thm_maroon}"
set -g window-status-bell-style "bg=default,fg=#{@thm_red},bold"
set -g window-status-separator " "
set -g window-status-current-format "#[bg=#{@thm_base}]#{@pill_l}#[fg=#{@thm_peach}#,bg=#{@thm_base}#,bold]#I#[fg=#{@thm_text}#,bg=#{@thm_base}#,nobold]#{?#{!=:#{window_name},Window},: #W,}#[bg=#{@thm_base}]#{@pill_r}#[bg=default]"

# ============================================================================
# 6. Pane borders
# ============================================================================
setw -g pane-border-status top
set  -g window-style "bg=default"
# set -g window-active-style "bg=#{@thm_mantle}"   # active-pane bg tint (disabled)
# tag each pane with its program: active = peach chip, inactive = dim flat
setw -g pane-border-format "#{?pane_active,#[fg=#{@thm_base}#,bg=#{@thm_peach}#,bold] #{@ic_cmd} #{pane_current_command} ,#[fg=#{@thm_overlay_0}] #{@ic_cmd} #{pane_current_command} }"
setw -g pane-border-lines single
setw -g pane-active-border-style "bg=#{@thm_bg},fg=#{@thm_peach}"
setw -g pane-border-style        "bg=#{@thm_bg},fg=#{@thm_surface_0}"

# ============================================================================
# 7. Messages & copy-mode selection
# ============================================================================
set -g message-style         "bg=#{@thm_surface_0},fg=#{@thm_peach}"
set -g message-command-style "bg=#{@thm_surface_0},fg=#{@thm_peach}"
set -g mode-style            "bg=#{@thm_surface_1},fg=#{@thm_text}"

# ============================================================================
# 8. Popups
#    display-popup -S cannot expand #{...} formats, so the per-tool accents are
#    hardcoded hex (the global border style below CAN expand, hence the var).
# ============================================================================
set -g popup-border-lines rounded
set -g popup-border-style "fg=#{@thm_blue}"
set -g popup-style        "bg=#{@thm_mantle}"
# Neogit  C-g  → mauve  (#cba6f7)
bind -n C-g   display-popup -b rounded -S "fg=#cba6f7" -T " Neogit "    -E -xC -yC -w 80% -h 80% -d "#{pane_current_path}" "nvim -c Git"
# Worktrees  C-;  → handled by sfc-gh-kdickerson/tmux-worktree-manager plugin (see below)
# bind -n 'C-;' display-popup -b rounded -S "fg=#fab387" -T " Worktrees " -E -xC -yC -w 80% -h 80% -d "#{pane_current_path}" "$HOME/scripts/tmux-worktree-popup"

# ============================================================================
# 9. Plugins (TPM) — keep `run tpm` last
# ============================================================================
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-restore 'on'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'omerxx/tmux-sessionx'
set -g @plugin 'omerxx/tmux-floax'
set -g @plugin 'sfc-gh-kdickerson/tmux-worktree-manager'
set -g @tmux-worktree-manager-key 'C-;'
set -g @floax-bind '-n C-p'
set -g @floax-border-color "#89b4fa"
set -g @floax-text-color "#cdd6f4"
set -g @sessionx-bind 'o'
run '~/.tmux/plugins/tpm/tpm'
